<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wound Vision has moved</title>
<meta name="robots" content="noindex">
<!-- Kept deliberately simple. This page exists because the old address was printed on a QR
     code and handed out at a conference; paper cannot be re-issued, so this link has to work
     for good. No Vercel rewrite rule is used: a configuration entry can be lost in a settings
     change, a served file cannot. -->
<meta http-equiv="refresh" content="0; url=https://wound-vision.vercel.app/">
<link rel="canonical" href="https://wound-vision.vercel.app/">
<style>
  :root{--navy:#13263c;--muted:#5A7290;--teal:#1CB8A0;--line:#dde6f0;--bg:#f6f9fc}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);
       color:var(--navy);font:400 16px/1.6 "DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .box{max-width:460px;text-align:center;background:#fff;border:1px solid var(--line);
       border-radius:16px;padding:32px 28px;box-shadow:0 10px 30px rgba(19,38,60,.07)}
  h1{margin:0 0 10px;font-size:21px;letter-spacing:-.01em}
  p{margin:0 0 18px;color:var(--muted);font-size:14.5px}
  a.go{display:inline-block;background:var(--teal);color:#fff;text-decoration:none;font-weight:700;
       font-size:15px;padding:12px 22px;border-radius:999px}
  a.go:hover{filter:brightness(.95)}
  code{font-family:"DM Mono",ui-monospace,monospace;font-size:12.5px;color:var(--muted);
       word-break:break-all;display:block;margin-top:14px}
</style>
</head>
<body>
  <div class="box">
    <h1>Wound Vision has moved</h1>
    <p>Taking you there now. If nothing happens, use the button.</p>
    <a class="go" id="go" href="https://wound-vision.vercel.app/">Open Wound Vision</a>
    <code id="url">https://wound-vision.vercel.app/</code>
  </div>
<script>
  var TARGET = "https://wound-vision.vercel.app/";
  /* Carry the query string and the fragment across, so a bookmark of /dfu/?v=15#train still
     lands in the right place. */
  var to = TARGET.replace(/\/$/, "/") + location.search + location.hash;
  document.getElementById("go").href = to;
  document.getElementById("url").textContent = to;
  location.replace(to);
</script>
</body>
</html>
