<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wound Vision — Pressure Injury</title>
<!-- A real /pi/ link, redirecting to the one application locked to the pressure injury arm.
     A redirect rather than a copy: the segmentation model alone is 12 MB and is identical for
     both wound types, so a second copy of the app would be two copies of the same models to
     version, deploy and keep in step, and every fix would have to land twice. One codebase,
     two front doors. -->
<meta http-equiv="refresh" content="0; url=../dfu/?arm=pi">
<link rel="canonical" href="../dfu/?arm=pi">
<script>location.replace('../dfu/?arm=pi' + location.hash);</script>
<style>
  body{font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1e293b;
       background:#f1f5f9;margin:0;display:grid;place-items:center;min-height:100vh;padding:24px}
  a{color:#0f766e}
</style>
</head>
<body>
  <p>Opening <b>Wound Vision — Pressure Injury</b>…<br>
     <a href="../dfu/?arm=pi">Continue if nothing happens</a></p>
</body>
