<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dengue Intelligence — HTPN</title>
<!-- Fonts + Chart.js load fine inside Apps Script HtmlService (IFRAME sandbox). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  /* ── brand chrome (UI furniture only — NOT data ink) ── */
  --navy:#0B1F3A; --navy-mid:#112847; --navy-light:#1A3860;
  --teal:#1CB8A0; --teal-dim:#15927F;
  --surface:#10202f;               /* chart/card surface */
  --panel:rgba(255,255,255,.04);
  --line:rgba(255,255,255,.09);
  --text:#E8EFF8; --muted:#9DB6CE; --faint:#5f7c98;
  /* ── data ink: validated categorical palette (dark steps) ── */
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#43b04a; --s7:#9085e9; --s8:#e66767;
  /* ── status (dengue triage traffic-light — reserved, always labelled) ── */
  --ok:#43b04a; --warn:#c98500; --crit:#e66767;
  /* ── sequential blue ramp (magnitude / heatmap) low→high ── */
  --q1:#cde2fb; --q2:#9ec5f4; --q3:#6da7ec; --q4:#3987e5; --q5:#256abf; --q6:#184f95; --q7:#0d366b;
  --serif:'DM Serif Display',serif; --sans:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
  --r:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--navy);color:var(--text);font-size:14px;line-height:1.5;overflow:hidden}

/* ── shell: header + rail + one scroll-free panel area ── */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:900px;margin:0 auto}

header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--teal),var(--teal-dim));display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;color:#fff;box-shadow:0 0 18px rgba(28,184,160,.35);flex-shrink:0}
.brand h1{font-family:var(--serif);font-size:17px;line-height:1.1}
.brand .sub{font-size:11px;color:var(--muted)}
.brand .by{font-size:10.5px;color:var(--teal);font-weight:700}
.demo{flex-shrink:0;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--warn);border:1px solid rgba(201,133,0,.4);background:rgba(201,133,0,.1);padding:5px 10px;border-radius:30px;text-transform:uppercase}

/* tab rail — horizontal scroll IS allowed (navigation, not content) */
nav.rail{flex:0 0 auto;display:flex;gap:4px;overflow-x:auto;padding:8px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.rail::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:none;border-bottom:2.5px solid transparent;color:var(--muted);font-family:var(--sans);font-size:12.5px;font-weight:600;padding:7px 11px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:.15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--teal);border-bottom-color:var(--teal)}
.tab .ico{font-size:14px}

/* panel area: exactly fills remaining height, never scrolls */
main{flex:1 1 auto;position:relative;overflow:hidden;padding:14px 18px 10px}
.panel{position:absolute;inset:14px 18px 10px;display:none;flex-direction:column}
.panel.active{display:flex}
.phead{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:8px}
.phead h2{font-family:var(--serif);font-size:19px;line-height:1.15}
.phead p{font-size:11.5px;color:var(--muted)}

/* step pager (splits a section into ≤2 no-scroll steps) */
.stepper{display:flex;align-items:center;gap:8px;flex-shrink:0}
.stepper button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;width:30px;height:30px;font-size:15px;cursor:pointer}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper .dot{font-size:11px;color:var(--muted);font-family:var(--mono)}
.step{flex:1 1 auto;min-height:0;flex-direction:column}
.step{display:none}.step.active{display:flex}

/* card that holds a single visual + its two captions */
.viz{flex:1 1 auto;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column}
.viz .vtitle{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text);flex-shrink:0}
.canvas-wrap{flex:1 1 auto;min-height:0;position:relative;margin:8px 0}
canvas{max-width:100%}

/* the two mandatory captions */
.caps{flex:0 0 auto;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px;display:flex;flex-direction:column;gap:3px}
.cap{font-size:11.5px;line-height:1.45;color:var(--muted)}
.cap b{color:var(--teal);font-weight:700}
.cap.finding b{color:var(--warn)}

/* KPI big-number grid */
.kpis{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;height:3px;width:100%;background:var(--accent,var(--teal))}
.kpi .k-ico{font-size:18px}
.kpi .k-val{font-family:var(--serif);font-size:30px;line-height:1;margin:4px 0 2px}
.kpi .k-val small{font-size:15px;color:var(--muted)}
.kpi .k-lab{font-size:11px;color:var(--muted);font-weight:600}
.kpi .k-sub{font-size:10px;color:var(--faint);margin-top:3px}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.brand .sub{display:none}}

/* heatmap tile-grid cartogram */
.mapwrap{flex:1 1 auto;min-height:0;display:flex;gap:14px}
.tilemap{flex:1 1 auto;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(7,1fr);gap:5px;min-height:0}
.tile{border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#08111c;padding:2px;text-align:center;line-height:1.1;border:1px solid rgba(255,255,255,.06)}
.tile .tv{font-family:var(--mono);font-size:12px;font-weight:700}
.legend{flex:0 0 92px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.legend .lg-title{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.4px}
.legend .bar{height:110px;width:14px;border-radius:4px;background:linear-gradient(to top,var(--q1),var(--q4),var(--q7))}
.legend .lg-row{display:flex;gap:6px;align-items:center}
.legend .lg-scale{font-size:9.5px;color:var(--faint);display:flex;flex-direction:column;justify-content:space-between;height:110px}

/* strategy / RAG panel */
.strat{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.gline{flex:0 0 auto;font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.gline a{color:var(--teal)}
.recs{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.rec{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:10px 12px;background:var(--panel)}
.rec.ok{border-left-color:var(--ok)} .rec.warn{border-left-color:var(--warn)} .rec.crit{border-left-color:var(--crit)}
.rec .rt{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.rec .rp{font-size:11.5px;color:var(--muted);margin-top:3px}
.rec .rtag{font-size:9.5px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:20px;letter-spacing:.04em}
.rtag.ok{background:rgba(67,176,74,.14);color:var(--ok)} .rtag.warn{background:rgba(201,133,0,.16);color:var(--warn)} .rtag.crit{background:rgba(230,103,103,.16);color:var(--crit)}
.rec .src{font-size:10px;color:var(--faint);margin-top:5px;font-style:italic}

footer{flex:0 0 auto;font-size:10px;color:var(--faint);text-align:center;padding:6px 18px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <div class="logo">Dn</div>
      <div>
        <h1>Dengue Intelligence</h1>
        <div class="sub">Healthcare Intelligence Office · Hospital Tengku Permaisuri Norashikin</div>
        <div class="by">By Dr Naim &amp; AI Team HTPN</div>
      </div>
    </div>
    <div class="demo">Demo · synthetic data</div>
  </header>

  <nav class="rail" id="rail"></nav>

  <main id="main"></main>

  <footer>Synthetic sample data for demonstration. Replace <code>DATA</code> object with a live feed. · Forecast: Holt–Winters additive exponential smoothing.</footer>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   1.  DATA  — synthetic, deterministic.  REPLACE THIS BLOCK with your feed.
       In Google Apps Script:  google.script.run.withSuccessHandler(init).getData();
       or  const DATA = <?!= JSON.stringify(serverData) ?>;
   ══════════════════════════════════════════════════════════════════════ */
const WEEKS = 156;                              // 3 years of weekly data
function seeded(n){ let s=Math.sin(n)*10000; return s-Math.floor(s); }   // deterministic pseudo-random
const series = (()=>{
  const out=[]; const start=new Date('2023-09-11');
  for(let t=0;t<WEEKS;t++){
    const season = 300*Math.pow(Math.sin(Math.PI*(t%52)/52),2);   // annual monsoon peak
    const trend  = 120 + t*0.9;                                   // slow secular rise
    const noise  = (seeded(t*1.7)-0.5)*90;
    const cases  = Math.max(20, Math.round(trend + season + noise));
    const d=new Date(start); d.setDate(d.getDate()+t*7);
    out.push({week:t+1, date:d, cases});
  }
  return out;
})();
const totalCases   = series.reduce((a,b)=>a+b.cases,0);
const last12       = series.slice(-12).reduce((a,b)=>a+b.cases,0);
const prev12       = series.slice(-24,-12).reduce((a,b)=>a+b.cases,0);
const deaths       = Math.round(totalCases*0.0026);              // CFR ≈ 0.26%
const cfr          = (deaths/totalCases*100);
const admitted     = Math.round(totalCases*0.34);               // 34% admission rate
const costPerAdmit = 3850;                                       // RM per admission (indicative)
const totalCost    = admitted*costPerAdmit;

// severity mix (dengue triage groups) — counts
const severity = [
  {label:'Group A · Dengue, no warning signs', v:Math.round(totalCases*0.62), c:'--ok'},
  {label:'Group B · Dengue WITH warning signs', v:Math.round(totalCases*0.31), c:'--warn'},
  {label:'Group C · Severe dengue',             v:Math.round(totalCases*0.07), c:'--crit'}
];
// by department / ward
const depts = [
  {label:'Medical',      v:Math.round(admitted*0.44)},
  {label:'Paediatrics',  v:Math.round(admitted*0.27)},
  {label:'ICU / HDU',    v:Math.round(admitted*0.09)},
  {label:'O&G',          v:Math.round(admitted*0.08)},
  {label:'Emergency (obs)',v:Math.round(admitted*0.12)}
];
// length of stay distribution (days) — histogram bins
const losBins = [
  {bin:'1',v:210},{bin:'2',v:640},{bin:'3',v:880},{bin:'4',v:720},
  {bin:'5',v:470},{bin:'6',v:250},{bin:'7',v:150},{bin:'8+',v:120}
];
// scatter: platelet nadir (×10⁹/L) vs day of illness at nadir
const scatter = (()=>{ const p=[]; for(let i=0;i<90;i++){
  const day=3+seeded(i*3.1)*5;                          // day 3–8
  const plt=140-16*(day-3)+ (seeded(i*5.7)-0.5)*40;     // falls then recovers
  p.push({x:+day.toFixed(1), y:Math.max(8,Math.round(plt))});
} return p; })();
// state burden — cases per 100k (Selangor/KL highest, as in reality)
const states = [
  {abbr:'PLS',name:'Perlis',      r:1,c:1,v:38},
  {abbr:'KDH',name:'Kedah',       r:2,c:1,v:71},
  {abbr:'PNG',name:'P. Pinang',   r:3,c:1,v:118},
  {abbr:'PRK',name:'Perak',       r:4,c:1,v:96},
  {abbr:'SGR',name:'Selangor',    r:5,c:1,v:242},
  {abbr:'PJy',name:'Putrajaya',   r:6,c:1,v:150},
  {abbr:'MLK',name:'Melaka',      r:7,c:1,v:104},
  {abbr:'KTN',name:'Kelantan',    r:2,c:2,v:58},
  {abbr:'TRG',name:'Terengganu',  r:3,c:2,v:63},
  {abbr:'PHG',name:'Pahang',      r:4,c:2,v:82},
  {abbr:'KL', name:'Kuala Lumpur',r:5,c:2,v:205},
  {abbr:'NSN',name:'N. Sembilan', r:6,c:2,v:121},
  {abbr:'JHR',name:'Johor',       r:7,c:2,v:133},
  {abbr:'LBN',name:'Labuan',      r:2,c:5,v:44},
  {abbr:'SBH',name:'Sabah',       r:2,c:6,v:70},
  {abbr:'SWK',name:'Sarawak',     r:3,c:5,v:88}
];

/* ══════════════════════════════════════════════════════════════════════
   2.  FORECAST — Holt–Winters additive (triple exponential smoothing)
       Level + linear trend + additive annual season (m = 52 weeks).
       Smoothing params fixed (α,β,γ); a production build would fit these
       by minimising SSE (grid search / MLE).  80% band = ±1.28·σ·√h.
   ══════════════════════════════════════════════════════════════════════ */
function holtWinters(y, m, a, b, g, h){
  const n=y.length;
  let L = y.slice(0,m).reduce((p,c)=>p+c,0)/m;
  let T = (y.slice(m,2*m).reduce((p,c)=>p+c,0)/m - L)/m;
  const S=[]; for(let i=0;i<m;i++) S[i]=y[i]-L;          // initial seasonals
  const fit=[];
  for(let t=0;t<n;t++){
    const si = t-m>=0 ? S[t] : S[t];
    const f = L + T + (S[t%m]);                          // one-step-ahead
    fit.push(f);
    const prevL=L;
    L = a*(y[t]-S[t%m]) + (1-a)*(L+T);
    T = b*(L-prevL) + (1-b)*T;
    S[t%m] = g*(y[t]-L) + (1-g)*S[t%m];
  }
  // residual SD (one-step, in-sample, skip first cycle)
  let se=0,cnt=0; for(let t=m;t<n;t++){ se+=(y[t]-fit[t])**2; cnt++; }
  const sigma=Math.sqrt(se/cnt);
  const fc=[]; for(let k=1;k<=h;k++){
    const point = L + k*T + S[(n+k-1)%m];
    const band  = 1.28*sigma*Math.sqrt(k);
    fc.push({point:Math.max(0,point), lo:Math.max(0,point-band), hi:point+band});
  }
  return {fit, fc, sigma};
}
const HW = holtWinters(series.map(s=>s.cases), 52, 0.30, 0.05, 0.35, 12);

/* ══════════════════════════════════════════════════════════════════════
   3.  CHART.js shared theme
   ══════════════════════════════════════════════════════════════════════ */
const css=getComputedStyle(document.documentElement);
const C=k=>css.getPropertyValue(k).trim();
Chart.defaults.font.family="'DM Sans',sans-serif";
Chart.defaults.color=C('--muted');
Chart.defaults.font.size=11;
const GRID=C('--line'), TXT=C('--muted');
const gridX={grid:{color:GRID,drawTicks:false},ticks:{color:TXT},border:{color:GRID}};
const gridY={grid:{color:GRID,drawTicks:false},ticks:{color:TXT},border:{display:false},beginAtZero:true};
const fmt=n=>n.toLocaleString('en-MY');

/* ══════════════════════════════════════════════════════════════════════
   4.  SECTION DEFINITIONS  (tabs → steps → one visual each)
   ══════════════════════════════════════════════════════════════════════ */
const SECTIONS=[
 {id:'overview', ico:'📊', label:'Overview',    build:buildOverview},
 {id:'trends',   ico:'📈', label:'Trends',      build:buildTrends,   steps:['Weekly cases','12-week forecast']},
 {id:'mix',      ico:'🧬', label:'Case mix',    build:buildMix,      steps:['Severity','By department']},
 {id:'dist',     ico:'🔬', label:'Distributions',build:buildDist,    steps:['Length of stay','Platelet nadir']},
 {id:'geo',      ico:'🗺️', label:'Geography',    build:buildGeo},
 {id:'strategy', ico:'🧭', label:'Strategy',     build:buildStrategy}
];

/* helper: build a viz card with the two mandatory captions */
function vizCard(title, howRead, whatShows){
  return `<div class="viz">
    <div class="vtitle">${title}</div>
    <div class="canvas-wrap"><canvas></canvas></div>
    <div class="caps">
      <div class="cap"><b>How to read this:</b> ${howRead}</div>
      <div class="cap finding"><b>What this shows:</b> ${whatShows}</div>
    </div></div>`;
}
const chartRegistry=[];
function newChart(canvas,cfg){ const ch=new Chart(canvas,cfg); chartRegistry.push(ch); return ch; }
function clearCharts(){ chartRegistry.forEach(c=>c.destroy()); chartRegistry.length=0; }

/* ── OVERVIEW: big numbers ── */
function buildOverview(host){
  const chg=((last12-prev12)/prev12*100);
  host.innerHTML=`
   <div class="phead"><div><h2>Overview</h2><p>Rolling snapshot · last 156 weeks</p></div></div>
   <div class="kpis">
     <div class="kpi" style="--accent:var(--s1)"><div class="k-ico">🦟</div><div class="k-val">${fmt(totalCases)}</div><div class="k-lab">Total dengue cases</div><div class="k-sub">notified, 3-year window</div></div>
     <div class="kpi" style="--accent:var(--crit)"><div class="k-ico">🕯️</div><div class="k-val">${deaths}</div><div class="k-lab">Deaths</div><div class="k-sub">dengue-attributed</div></div>
     <div class="kpi" style="--accent:var(--warn)"><div class="k-ico">📉</div><div class="k-val">${cfr.toFixed(2)}<small>%</small></div><div class="k-lab">Case-fatality rate</div><div class="k-sub">deaths ÷ cases</div></div>
     <div class="kpi" style="--accent:var(--s3)"><div class="k-ico">🏥</div><div class="k-val">${(admitted/totalCases*100).toFixed(0)}<small>%</small></div><div class="k-lab">Admission ratio</div><div class="k-sub">${fmt(admitted)} admitted</div></div>
     <div class="kpi" style="--accent:var(--s7)"><div class="k-ico">💰</div><div class="k-val"><small>RM</small> ${(totalCost/1e6).toFixed(1)}<small>m</small></div><div class="k-lab">Inpatient cost</div><div class="k-sub">≈RM${fmt(costPerAdmit)}/admission</div></div>
     <div class="kpi" style="--accent:${chg>=0?'var(--crit)':'var(--ok)'}"><div class="k-ico">${chg>=0?'⬆️':'⬇️'}</div><div class="k-val">${chg>=0?'+':''}${chg.toFixed(0)}<small>%</small></div><div class="k-lab">Last 12 wks vs prior 12</div><div class="k-sub">${fmt(last12)} recent cases</div></div>
   </div>
   <div class="caps" style="margin-top:10px">
     <div class="cap"><b>How to read this:</b> each tile is one headline number; the coloured strip flags its domain (blue = volume, red = mortality, amber = risk, green = capacity, violet = cost).</div>
     <div class="cap finding"><b>What this shows:</b> case volume is ${chg>=0?'rising':'falling'} (${chg>=0?'+':''}${chg.toFixed(0)}% over the latest 12 weeks) while case-fatality stays low at ${cfr.toFixed(2)}%; inpatient cost has reached RM${(totalCost/1e6).toFixed(1)}m.</div>
   </div>`;
}

/* ── TRENDS: step 1 line, step 2 forecast ── */
function buildTrends(host, stepEls){
  // step 1 — weekly cases + 4-week moving average (same axis, no dual scale)
  const ma=series.map((_,i)=>{const s=series.slice(Math.max(0,i-3),i+1);return s.reduce((a,b)=>a+b.cases,0)/s.length;});
  const labels=series.map(s=>s.date.toLocaleDateString('en-MY',{month:'short',year:'2-digit'}));
  const recentUp=ma[ma.length-1]>=ma[ma.length-5];
  stepEls[0].innerHTML=vizCard('Weekly notified cases',
    'the thin blue line is each week&rsquo;s count; the solid green line is the 4-week moving average that smooths the noise.',
    `cases follow a clear annual monsoon cycle; the moving average is currently ${recentUp?'climbing':'falling'}, placing us ${recentUp?'on the up-slope of':'past the peak of'} a wave.`);
  newChart(stepEls[0].querySelector('canvas'),{type:'line',data:{labels,datasets:[
     {label:'Weekly cases',data:series.map(s=>s.cases),borderColor:C('--s1'),backgroundColor:'transparent',borderWidth:1.5,pointRadius:0,tension:.25},
     {label:'4-week moving average',data:ma,borderColor:C('--s3'),borderWidth:2.5,pointRadius:0,tension:.35}
   ]},options:lineOpts(true)});

  // step 2 — Holt-Winters forecast
  const fh=HW.fc.length;
  const histLbl=series.slice(-40).map(s=>s.date.toLocaleDateString('en-MY',{month:'short',year:'2-digit'}));
  const fcLbl=[]; let d=new Date(series[series.length-1].date); for(let i=1;i<=fh;i++){d=new Date(d);d.setDate(d.getDate()+7);fcLbl.push(d.toLocaleDateString('en-MY',{month:'short',year:'2-digit'}));}
  const labels2=histLbl.concat(fcLbl);
  const hist=series.slice(-40).map(s=>s.cases);
  const pad=new Array(hist.length-1).fill(null);
  const point=pad.concat([hist[hist.length-1]], HW.fc.map(f=>Math.round(f.point)));
  const hi=pad.concat([hist[hist.length-1]], HW.fc.map(f=>Math.round(f.hi)));
  const lo=pad.concat([hist[hist.length-1]], HW.fc.map(f=>Math.round(f.lo)));
  const fcUp=HW.fc[fh-1].point>=HW.fc[0].point;
  stepEls[1].innerHTML=vizCard('12-week forecast · Holt–Winters additive',
    'blue = observed history; the dashed orange line = forecast; the shaded band is the 80% prediction interval — wider further out means less certainty.',
    `the model projects weekly cases ${fcUp?'climbing back up':'easing'} over the next 12 weeks (central estimate ${fmt(Math.round(HW.fc[fh-1].point))} cases at week +12, 80% band ±${fmt(Math.round(1.28*HW.sigma*Math.sqrt(fh)))}).`);
  newChart(stepEls[1].querySelector('canvas'),{type:'line',data:{labels:labels2,datasets:[
     {label:'Observed',data:hist.concat(new Array(fh).fill(null)),borderColor:C('--s1'),borderWidth:2,pointRadius:0,tension:.25},
     {label:'Forecast',data:point,borderColor:C('--s2'),borderWidth:2.5,borderDash:[5,4],pointRadius:0,tension:.25},
     {label:'80% upper',data:hi,borderColor:'transparent',backgroundColor:'rgba(217,89,38,.16)',pointRadius:0,fill:'+1'},
     {label:'80% lower',data:lo,borderColor:'transparent',backgroundColor:'transparent',pointRadius:0,fill:false}
   ]},options:lineOpts(true,[0,1])});
}

/* ── CASE MIX: step1 pie, step2 bar ── */
function buildMix(host, stepEls){
  stepEls[0].innerHTML=vizCard('Severity mix · dengue triage groups',
    'each slice is a share of all cases; green→amber→red rises with clinical severity (WHO/MOH triage Groups A, B, C).',
    `most patients (${(severity[0].v/totalCases*100).toFixed(0)}%) are Group A, but ${(severity[2].v/totalCases*100).toFixed(0)}% are severe dengue (Group C) needing intensive care.`);
  newChart(stepEls[0].querySelector('canvas'),{type:'doughnut',data:{labels:severity.map(s=>s.label),datasets:[{data:severity.map(s=>s.v),backgroundColor:severity.map(s=>C(s.c)),borderColor:C('--surface'),borderWidth:2}]},
    options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10,padding:8,font:{size:10.5}}},tooltip:{callbacks:{label:c=>`${c.label}: ${fmt(c.parsed)} (${(c.parsed/totalCases*100).toFixed(1)}%)`}}}}});

  stepEls[1].innerHTML=vizCard('Admissions by department',
    'each bar is the number of dengue admissions handled by that clinical department; longer = more.',
    `Medical wards carry the largest share (${(depts[0].v/admitted*100).toFixed(0)}%), with ICU/HDU absorbing the sickest ${(depts[2].v/admitted*100).toFixed(0)}%.`);
  newChart(stepEls[1].querySelector('canvas'),{type:'bar',data:{labels:depts.map(d=>d.label),datasets:[{label:'Admissions',data:depts.map(d=>d.v),backgroundColor:C('--s1'),borderRadius:4,barPercentage:.7}]},
    options:{maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${fmt(c.parsed.x)} admissions`}}},scales:{x:gridY,y:{...gridX,grid:{display:false}}}}});
}

/* ── DISTRIBUTIONS: step1 histogram, step2 scatter ── */
function buildDist(host, stepEls){
  stepEls[0].innerHTML=vizCard('Length of stay (histogram)',
    'the x-axis groups admissions by nights stayed; bar height is how many patients fell in each group.',
    `stay peaks at 3 days and is right-skewed — a long tail of ${fmt(losBins[losBins.length-1].v)} patients stay 8+ days.`);
  newChart(stepEls[0].querySelector('canvas'),{type:'bar',data:{labels:losBins.map(b=>b.bin),datasets:[{label:'Patients',data:losBins.map(b=>b.v),backgroundColor:C('--s7'),borderRadius:3,categoryPercentage:.98,barPercentage:.96}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>`${c[0].label} night(s)`,label:c=>`${fmt(c.parsed.y)} patients`}}},scales:{x:{...gridX,grid:{display:false},title:{display:true,text:'Nights in hospital',color:TXT}},y:gridY}}});

  stepEls[1].innerHTML=vizCard('Platelet nadir vs day of illness (scatter)',
    'each dot is one patient — horizontal = day of illness the lowest platelet was recorded, vertical = that platelet count (×10⁹/L).',
    `platelet nadir clusters around days 5–7 of illness, the classic critical-phase window for close monitoring.`);
  newChart(stepEls[1].querySelector('canvas'),{type:'scatter',data:{datasets:[{label:'Patient',data:scatter,backgroundColor:'rgba(57,135,229,.55)',borderColor:C('--s1'),pointRadius:4,pointHoverRadius:6}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`Day ${c.parsed.x}, ${c.parsed.y}×10⁹/L`}}},scales:{x:{...gridX,title:{display:true,text:'Day of illness at nadir',color:TXT}},y:{...gridY,title:{display:true,text:'Platelet ×10⁹/L',color:TXT}}}}});
}

/* ── GEOGRAPHY: tile-grid cartogram heatmap ── */
function buildGeo(host){
  const vals=states.map(s=>s.v), mn=Math.min(...vals), mx=Math.max(...vals);
  const ramp=['--q1','--q2','--q3','--q4','--q5','--q6','--q7'].map(C);
  const colorFor=v=>{const t=(v-mn)/(mx-mn);const i=Math.min(ramp.length-1,Math.floor(t*ramp.length));return ramp[i];};
  const inkFor=v=>((v-mn)/(mx-mn))>0.55?'#EAF2FF':'#08111c';
  let tiles=''; states.forEach(s=>{
    tiles+=`<div class="tile" title="${s.name}: ${s.v} per 100k" style="grid-row:${s.r};grid-column:${s.c};background:${colorFor(s.v)};color:${inkFor(s.v)}"><div>${s.abbr}</div><div class="tv">${s.v}</div></div>`;
  });
  host.innerHTML=`
   <div class="phead"><div><h2>Geography</h2><p>Dengue incidence by state · tile-grid cartogram</p></div></div>
   <div class="mapwrap">
     <div class="tilemap">${tiles}</div>
     <div class="legend">
       <div class="lg-title">Cases /100k</div>
       <div class="lg-row"><div class="bar"></div><div class="lg-scale"><span>${mx}</span><span>${Math.round((mn+mx)/2)}</span><span>${mn}</span></div></div>
     </div>
   </div>
   <div class="caps" style="margin-top:8px">
     <div class="cap"><b>How to read this:</b> each square is a state placed in roughly its map position; colour encodes annual incidence in <b>cases per 100,000 population</b> — <b>bright/pale blue = low burden, dark blue = high burden</b>.</div>
     <div class="cap finding"><b>What this shows:</b> the Klang Valley (Selangor ${states.find(s=>s.abbr==='SGR').v}, KL ${states.find(s=>s.abbr==='KL').v} /100k) is the national hotspot, far above East Malaysia.</div>
   </div>`;
}

/* ── STRATEGY: rule-based recommendation engine (RAG-ready) ── */
function buildStrategy(host){
  // rules derived from MOH/AMM CPG "Management of Dengue Infection in Adults"
  const recs=[];
  const chg=((last12-prev12)/prev12*100);
  const severePct=severity[2].v/totalCases*100;
  const icuShare=depts[2].v/admitted*100;
  if(chg>10) recs.push({lvl:'crit',t:'Activate outbreak response',
     p:`Cases rose +${chg.toFixed(0)}% over 12 weeks. Convene the dengue outbreak committee, intensify vector control in Klang Valley hotspots, and open surge beds.`,
     src:'CPG §Public-health response; incidence trend trigger.'});
  if(severePct>5) recs.push({lvl:'warn',t:'Reinforce warning-sign triage',
     p:`Severe dengue is ${severePct.toFixed(1)}% of cases. Ensure every febrile patient is screened for warning signs (abdominal pain, persistent vomiting, bleeding, lethargy) and Group B/C admitted for monitoring.`,
     src:'CPG §Triage & admission criteria (Groups A/B/C).'});
  recs.push({lvl:'warn',t:'Protect the critical-phase window',
     p:`Platelet nadir clusters at illness days 5–7. Schedule at least daily FBC + haematocrit in this window; watch for haemoconcentration signalling plasma leakage.`,
     src:'CPG §Monitoring during critical phase.'});
  if(icuShare>7) recs.push({lvl:'crit',t:'Pre-position ICU/HDU capacity',
     p:`ICU/HDU already absorbs ${icuShare.toFixed(0)}% of admissions. Rehearse the severe-dengue fluid protocol and confirm HDU escalation pathways before the forecast peak.`,
     src:'CPG §Management of severe dengue / fluid resuscitation.'});
  recs.push({lvl:'ok',t:'Sustain judicious fluid therapy',
     p:`Case-fatality is low (${cfr.toFixed(2)}%). Maintain isotonic crystalloid protocols and avoid over-hydration; audit fluid charts against CPG targets.`,
     src:'CPG §Fluid management, uncomplicated dengue.'});

  host.innerHTML=`
   <div class="phead"><div><h2>Strategy</h2><p>Guideline-anchored recommendations</p></div></div>
   <div class="strat">
     <div class="gline">📖 Anchored to the <a href="https://www.acadmed.org.my/CPGdl/CPG%20Dengue%20Infection%20PDF%20Final.pdf" target="_blank" rel="noopener">MOH/AMM CPG — Management of Dengue Infection</a>.
       This panel is a <b>rule-based</b> engine mapping the current data to CPG-derived actions. To make it true <b>RAG</b>, wire an Apps Script call to an LLM with retrieved CPG passages (see code comment <code>RAG HOOK</code>).</div>
     <div class="recs">
       ${recs.map(r=>`<div class="rec ${r.lvl}"><div class="rt"><span>${r.lvl==='crit'?'🔴':r.lvl==='warn'?'🟠':'🟢'} ${r.t}</span> <span class="rtag ${r.lvl}">${r.lvl==='crit'?'Priority':r.lvl==='warn'?'Action':'Sustain'}</span></div><div class="rp">${r.p}</div><div class="src">Source: ${r.src}</div></div>`).join('')}
     </div>
     <div class="caps">
       <div class="cap"><b>How to read this:</b> each card is one recommendation, colour-coded by urgency (red = priority, amber = action, green = sustain), with its guideline source.</div>
       <div class="cap finding"><b>What this shows:</b> the data currently triggers ${recs.filter(r=>r.lvl==='crit').length} priority action(s)${recs.some(r=>r.lvl==='crit')?' — chiefly '+recs.find(r=>r.lvl==='crit').t.toLowerCase()+' ahead of the forecast peak':', so the focus is monitoring and sustaining current protocols'}.</div>
     </div>
   </div>`;
  /* RAG HOOK ───────────────────────────────────────────────────────────
     Replace the rule engine above with retrieval-augmented generation:
       1. In Code.gs, chunk + embed the CPG PDF once; store vectors.
       2. On load, build a query from the live metrics (chg, severePct…).
       3. Retrieve top-k CPG chunks, send {metrics, chunks} to an LLM
          (google.script.run.getStrategy → UrlFetchApp → Claude/Vertex).
       4. Render the returned recommendations into .recs.
     ─────────────────────────────────────────────────────────────────── */
}

/* shared line options */
function lineOpts(legend, fillPair){
  return {maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:legend,position:'bottom',labels:{boxWidth:10,padding:8,font:{size:10.5},filter:i=>!/upper|lower/.test(i.text)}},
      tooltip:{callbacks:{label:c=>c.parsed.y==null?null:`${c.dataset.label}: ${fmt(Math.round(c.parsed.y))}`}}},
    scales:{x:{...gridX,ticks:{...gridX.ticks,maxTicksLimit:8,autoSkip:true}},y:gridY}};
}

/* ══════════════════════════════════════════════════════════════════════
   5.  NAV / STEP MACHINERY
   ══════════════════════════════════════════════════════════════════════ */
const rail=document.getElementById('rail'), mainEl=document.getElementById('main');
SECTIONS.forEach((s,i)=>{
  const b=document.createElement('button'); b.className='tab'+(i===0?' active':'');
  b.innerHTML=`<span class="ico">${s.ico}</span>${s.label}`; b.onclick=()=>show(i); rail.appendChild(b);
  const p=document.createElement('div'); p.className='panel'+(i===0?' active':''); p.id='p-'+s.id; mainEl.appendChild(p);
});
function show(i){
  clearCharts();
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',j===i));
  document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('active',j===i));
  render(i);
}
function render(i){
  const s=SECTIONS[i], host=document.getElementById('p-'+s.id); host.innerHTML='';
  if(!s.steps){ s.build(host); return; }
  // multi-step section: header + pager + step containers
  host.innerHTML=`<div class="phead"><div><h2>${s.label}</h2><p id="sp-${s.id}"></p></div>
     <div class="stepper"><button id="pv-${s.id}">‹</button><span class="dot" id="dt-${s.id}"></span><button id="nx-${s.id}">›</button></div></div>`;
  const stepEls=s.steps.map((_,k)=>{const d=document.createElement('div');d.className='step'+(k===0?' active':'');host.appendChild(d);return d;});
  s.build(host,stepEls);
  let cur=0; const upd=()=>{
    stepEls.forEach((e,k)=>e.classList.toggle('active',k===cur));
    document.getElementById('dt-'+s.id).textContent=`${cur+1} / ${s.steps.length}`;
    document.getElementById('sp-'+s.id).textContent=s.steps[cur];
    document.getElementById('pv-'+s.id).disabled=cur===0;
    document.getElementById('nx-'+s.id).disabled=cur===s.steps.length-1;
  };
  document.getElementById('pv-'+s.id).onclick=()=>{if(cur>0){cur--;upd();}};
  document.getElementById('nx-'+s.id).onclick=()=>{if(cur<s.steps.length-1){cur++;upd();}};
  upd();
}
render(0);
</script>
